site_name: Danish CVR Registry API Documentation
site_description: Complete documentation for the Danish Central Business Register (CVR) Elasticsearch API
site_url: https://brokk-sindre.github.io/cvr-documentation/
repo_url: https://github.com/Brokk-Sindre/cvr-documentation
repo_name: Brokk-Sindre/cvr-documentation
edit_uri: edit/main/docs/

# Theme Configuration
theme:
  name: material
  language: en
  
  # Theme Features
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - toc.follow
    - toc.integrate
  
  # Color Palette
  palette:
    # Light Mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    
    # Dark Mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  
  # Fonts
  font:
    text: Roboto
    code: Roboto Mono
  
  # Icons
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  
  # Favicon
  favicon: assets/images/favicon.png

# Navigation Structure
nav:
  - Home: index.md
  - Getting Started:
    - Authentication: getting-started/authentication.md
    - Quick Start: getting-started/quick-start.md
  - API Reference:
    - Complete Documentation: api-reference/overview.md
    - Field Reference: api-reference/field-reference.md
  - Query Examples:
    - Query Cookbook: queries/cookbook.md
  - Implementation:
    - Implementation Guide: implementation/overview.md

# Plugins
plugins:
  - search:
      lang: en
      separator: '[\s\-\.]+'
  - git-revision-date-localized:
      type: date
      timezone: Europe/Copenhagen
      fallback_to_build_date: true
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true

# Extensions
markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  
  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Extra Configuration
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/your-username/cvr-api-docs
      name: GitHub Repository
    - icon: fontawesome/solid/envelope
      link: mailto:cvrselvbetjening@erst.dk
      name: CVR Support Email
  
  # Analytics (optional - replace with your tracking ID)
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX

# Copyright
copyright: >
  Documentation for the Danish CVR Registry API. 
  <a href="https://datacvr.virk.dk/data/">Official CVR Portal</a> | 
  <a href="mailto:cvrselvbetjening@erst.dk">CVR Support</a>

# Additional CSS/JS
extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/extra.js